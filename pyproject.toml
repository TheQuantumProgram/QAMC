[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qam-checker"
version = "0.1.0"
description = "QAMC: An Abstraction-Aware Quantum Program Model Checking Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.10.9"]

[project.scripts]
qam-check = "qamc.cli.main:main"
qamc-check = "qamc.cli.main:main"
qam-evaluate = "qamc.cli.experiments:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["qamc*"]
